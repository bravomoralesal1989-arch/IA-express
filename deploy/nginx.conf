server {
    listen 80;
    server_name express.aedia.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name express.aedia.es;

    ssl_certificate /etc/letsencrypt/live/express.aedia.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/express.aedia.es/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compresión Gzip para respuesta ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ruta directa para validación de clave IndexNow por Bing y Perplexity
    location ~* ^/[a-zA-Z0-9]+\.txt$ {
        proxy_pass http://127.0.0.1:8050;
    }
}
